<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aquarium Water Chemistry Monitor</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen">
<div class="max-w-5xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-blue-900 mb-2">Aquarium Water Chemistry Monitor</h1>
  <p class="text-blue-700 mb-6">Track tank parameters. Get alerts for dangerous levels.</p>

  <div class="flex justify-end mb-6">
    <button onclick="openTankModal(null)" aria-label="Add new tank"
      class="bg-blue-700 text-white px-5 py-2 rounded-lg hover:bg-blue-800 font-medium">
      + Add Tank
    </button>
  </div>

  <div id="tankList" class="space-y-6"></div>
  <div id="emptyState" class="hidden text-center py-16 text-blue-400">
    <div class="text-5xl mb-3">🐠</div>
    <p class="text-lg font-medium">No tanks yet</p>
    <p class="text-sm mt-1">Click "+ Add Tank" to begin monitoring</p>
  </div>
</div>

<!-- Tank Modal -->
<div id="tankModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-sm">
    <div class="p-6">
      <h2 id="tankModalTitle" class="text-xl font-bold text-gray-900 mb-5">Add Tank</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="tName">Tank Name *</label>
          <input id="tName" type="text" placeholder="e.g. Community 55L" aria-label="Tank name"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="tVolume">Volume (L)</label>
          <input id="tVolume" type="number" min="1" step="1" aria-label="Tank volume in liters"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <input type="hidden" id="tEditId"/>
        <div class="flex gap-3">
          <button onclick="saveTank()" class="flex-1 bg-blue-700 text-white py-2 rounded-lg hover:bg-blue-800 font-medium">Save</button>
          <button onclick="closeTankModal()" class="flex-1 border border-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-50 font-medium">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Reading Modal -->
<div id="readingModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-sm max-h-[90vh] overflow-y-auto">
    <div class="p-6">
      <h2 class="text-xl font-bold text-gray-900 mb-4">Log Reading</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="rDate">Date</label>
          <input id="rDate" type="date" aria-label="Reading date"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="rPh">pH</label>
            <input id="rPh" type="number" step="0.1" min="0" max="14" placeholder="7.0" aria-label="pH level"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="rTemp">Temp (°C)</label>
            <input id="rTemp" type="number" step="0.5" placeholder="25" aria-label="Temperature"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="rAmm">NH₃ (ppm)</label>
            <input id="rAmm" type="number" step="0.01" min="0" placeholder="0" aria-label="Ammonia in ppm"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="rNit">NO₂ (ppm)</label>
            <input id="rNit" type="number" step="0.01" min="0" placeholder="0" aria-label="Nitrite in ppm"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="rNita">NO₃ (ppm)</label>
            <input id="rNita" type="number" step="1" min="0" placeholder="0" aria-label="Nitrate in ppm"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
        </div>
        <input type="hidden" id="rTankId"/>
        <div class="flex gap-3">
          <button onclick="saveReading()" class="flex-1 bg-blue-700 text-white py-2 rounded-lg hover:bg-blue-800 font-medium">Save</button>
          <button onclick="closeReadingModal()" class="flex-1 border border-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-50 font-medium">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const KEY = 'aql_data';
let data = JSON.parse(localStorage.getItem(KEY) || '{"tanks":[]}');

function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

function getDangers(r) {
  const flags = [];
  if (r.ammonia !== null && r.ammonia > 0.25) flags.push({ label: `NH₃ ${r.ammonia}ppm`, level: 'red' });
  if (r.nitrite !== null && r.nitrite > 0.5) flags.push({ label: `NO₂ ${r.nitrite}ppm`, level: 'red' });
  if (r.ph !== null && (r.ph < 6 || r.ph > 8.5)) flags.push({ label: `pH ${r.ph}`, level: 'yellow' });
  return flags;
}

function openTankModal(id) {
  document.getElementById('tankModal').classList.remove('hidden');
  document.getElementById('tEditId').value = id || '';
  document.getElementById('tName').value = '';
  document.getElementById('tVolume').value = '';
  if (id) {
    const t = data.tanks.find(x => x.id === id);
    if (t) {
      document.getElementById('tankModalTitle').textContent = 'Edit Tank';
      document.getElementById('tName').value = t.name;
      document.getElementById('tVolume').value = t.volume || '';
    }
  } else { document.getElementById('tankModalTitle').textContent = 'Add Tank'; }
}

function closeTankModal() { document.getElementById('tankModal').classList.add('hidden'); }

function saveTank() {
  const name = document.getElementById('tName').value.trim();
  if (!name) { alert('Tank name required.'); return; }
  const id = document.getElementById('tEditId').value || crypto.randomUUID();
  const t = { id, name, volume: parseFloat(document.getElementById('tVolume').value) || null, readings: [] };
  const idx = data.tanks.findIndex(x => x.id === id);
  if (idx >= 0) { t.readings = data.tanks[idx].readings; data.tanks[idx] = t; }
  else data.tanks.push(t);
  save(); closeTankModal(); render();
}

function deleteTank(id) {
  if (!confirm('Delete this tank and all readings?')) return;
  data.tanks = data.tanks.filter(x => x.id !== id);
  save(); render();
}

function openReadingModal(tankId) {
  document.getElementById('readingModal').classList.remove('hidden');
  document.getElementById('rTankId').value = tankId;
  document.getElementById('rDate').value = new Date().toISOString().slice(0,10);
  ['rPh','rTemp','rAmm','rNit','rNita'].forEach(id => document.getElementById(id).value = '');
}

function closeReadingModal() { document.getElementById('readingModal').classList.add('hidden'); }

function saveReading() {
  const tankId = document.getElementById('rTankId').value;
  const t = data.tanks.find(x => x.id === tankId);
  if (!t) return;
  const r = {
    date: document.getElementById('rDate').value,
    ph: parseFloat(document.getElementById('rPh').value) || null,
    temp: parseFloat(document.getElementById('rTemp').value) || null,
    ammonia: parseFloat(document.getElementById('rAmm').value) || null,
    nitrite: parseFloat(document.getElementById('rNit').value) || null,
    nitrate: parseFloat(document.getElementById('rNita').value) || null,
  };
  t.readings.push(r);
  save(); closeReadingModal(); render();
}

function deleteReading(tankId, idx) {
  const t = data.tanks.find(x => x.id === tankId);
  if (t) { t.readings.splice(idx, 1); save(); render(); }
}

function sparkline(values, color = '#3b82f6') {
  const valid = values.filter(v => v !== null && v !== undefined);
  if (valid.length < 2) return '<span class="text-xs text-gray-300">no data</span>';
  const w = 80, h = 28;
  const min = Math.min(...valid), max = Math.max(...valid);
  const range = max - min || 1;
  const pts = valid.map((v, i) => {
    const x = (i / (valid.length - 1)) * (w - 4) + 2;
    const y = h - 2 - ((v - min) / range) * (h - 4);
    return `${x},${y}`;
  }).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="trend sparkline">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/>
  </svg>`;
}

function render() {
  const container = document.getElementById('tankList');
  const empty = document.getElementById('emptyState');
  if (data.tanks.length === 0) { container.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  container.innerHTML = data.tanks.map(t => {
    const sortedReadings = [...t.readings].sort((a, b) => a.date.localeCompare(b.date));
    const last = sortedReadings[sortedReadings.length - 1];
    const last7 = sortedReadings.slice(-7);
    const dangers = last ? getDangers(last) : [];

    const params = [
      { key: 'ph', label: 'pH', unit: '', color: '#8b5cf6' },
      { key: 'ammonia', label: 'NH₃', unit: 'ppm', color: '#ef4444' },
      { key: 'nitrite', label: 'NO₂', unit: 'ppm', color: '#f97316' },
      { key: 'nitrate', label: 'NO₃', unit: 'ppm', color: '#eab308' },
      { key: 'temp', label: 'Temp', unit: '°C', color: '#06b6d4' },
    ];

    return `
    <div class="bg-white border ${dangers.length > 0 ? 'border-red-300' : 'border-blue-200'} rounded-2xl shadow-sm overflow-hidden">
      <div class="px-5 py-4 border-b ${dangers.length > 0 ? 'border-red-200 bg-red-50' : 'border-blue-100 bg-blue-50'} flex items-center gap-3">
        <div class="flex-1">
          <div class="flex items-center gap-2 flex-wrap">
            <h3 class="font-bold text-gray-900 text-lg">${escHtml(t.name)}</h3>
            ${t.volume ? `<span class="text-sm text-blue-600">${t.volume}L</span>` : ''}
            ${dangers.map(d => `<span class="border text-xs px-2 py-0.5 rounded-full font-bold ${d.level === 'red' ? 'bg-red-100 text-red-700 border-red-300' : 'bg-yellow-100 text-yellow-700 border-yellow-300'}">⚠️ ${d.label}</span>`).join('')}
          </div>
          ${last ? `<div class="text-xs text-gray-500 mt-0.5">Last reading: ${last.date}</div>` : '<div class="text-xs text-gray-400 mt-0.5">No readings yet</div>'}
        </div>
        <div class="flex gap-1">
          <button onclick="openReadingModal('${t.id}')" aria-label="Log reading for ${escAttr(t.name)}"
            class="text-xs bg-blue-600 text-white hover:bg-blue-700 px-3 py-1.5 rounded-lg font-medium">+ Log</button>
          <button onclick="openTankModal('${t.id}')" aria-label="Edit tank ${escAttr(t.name)}"
            class="text-gray-400 hover:text-blue-600 p-1.5 rounded hover:bg-blue-100">✏️</button>
          <button onclick="deleteTank('${t.id}')" aria-label="Delete tank ${escAttr(t.name)}"
            class="text-gray-400 hover:text-red-600 p-1.5 rounded hover:bg-red-50">🗑️</button>
        </div>
      </div>

      <!-- Sparklines -->
      ${last7.length > 0 ? `
      <div class="px-5 py-3 border-b border-gray-100 grid grid-cols-5 gap-2">
        ${params.map(p => {
          const vals = last7.map(r => r[p.key]);
          const lastVal = last ? last[p.key] : null;
          return `<div class="text-center">
            <div class="text-xs text-gray-500 mb-1">${p.label}</div>
            ${sparkline(vals, p.color)}
            <div class="text-xs font-semibold mt-1" style="color:${p.color}">${lastVal !== null ? lastVal + p.unit : '—'}</div>
          </div>`;
        }).join('')}
      </div>` : ''}

      <!-- Recent readings table -->
      <div class="px-5 py-4">
        <div class="text-xs font-medium text-gray-500 mb-2">Recent Readings (${t.readings.length} total)</div>
        ${sortedReadings.length === 0 ? '<p class="text-sm text-gray-400 text-center py-3">Log your first reading</p>' :
        `<div class="overflow-x-auto"><table class="w-full text-xs">
          <thead><tr class="text-gray-400 border-b border-gray-100">
            <th class="text-left pb-2 font-medium">Date</th>
            <th class="text-center pb-2 font-medium">pH</th>
            <th class="text-center pb-2 font-medium">NH₃</th>
            <th class="text-center pb-2 font-medium">NO₂</th>
            <th class="text-center pb-2 font-medium">NO₃</th>
            <th class="text-center pb-2 font-medium">Temp</th>
            <th class="pb-2"></th>
          </tr></thead>
          <tbody>
            ${[...sortedReadings].reverse().slice(0,5).map((r, ri) => {
              const realIdx = t.readings.indexOf(sortedReadings[sortedReadings.length - 1 - ri]);
              const d = getDangers(r);
              const rowCls = d.some(x => x.level === 'red') ? 'bg-red-50' : d.length > 0 ? 'bg-yellow-50' : '';
              return `<tr class="border-b border-gray-50 ${rowCls}">
                <td class="py-1.5 text-gray-600">${r.date}</td>
                <td class="text-center py-1.5 ${r.ph !== null && (r.ph < 6 || r.ph > 8.5) ? 'text-yellow-600 font-bold' : 'text-gray-700'}">${r.ph ?? '—'}</td>
                <td class="text-center py-1.5 ${r.ammonia > 0.25 ? 'text-red-600 font-bold' : 'text-gray-700'}">${r.ammonia ?? '—'}</td>
                <td class="text-center py-1.5 ${r.nitrite > 0.5 ? 'text-red-600 font-bold' : 'text-gray-700'}">${r.nitrite ?? '—'}</td>
                <td class="text-center py-1.5 text-gray-700">${r.nitrate ?? '—'}</td>
                <td class="text-center py-1.5 text-gray-700">${r.temp ? r.temp + '°' : '—'}</td>
                <td class="text-center py-1.5"><button onclick="deleteReading('${t.id}',${t.readings.lastIndexOf(sortedReadings[sortedReadings.length - 1 - ri])})" aria-label="Delete reading" class="text-gray-300 hover:text-red-500 leading-none">✕</button></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>`}
      </div>
    </div>`;
  }).join('');
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }

document.getElementById('tankModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeTankModal(); });
document.getElementById('readingModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeReadingModal(); });

render();
</script>
</body>
</html>
